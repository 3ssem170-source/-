.slot.ok{border-color:var(--ok);color:var(--ok)}.slot.no{border-color:var(--bad);color:var(--bad)}

.w{border-bottom:2px dotted var(--acc);cursor:help}.w.red{color:var(--bad);border-color:var(--bad)}

li{margin:6px 0}

let queue=[],total=0,res={right:0},cur="";
function start(k,force){cur=k;MODE="prac";const Q=LEC[k].Q;Q.forEach(q=>q.w=0);const now=Date.now();
let it=force?[...Q]:Q.filter(q=>((S.boxes[q.f]||{}).due||0)<=now);
if(!it.length){app.innerHTML='<div class="card"><h1>لا مراجعة مستحقة الآن 🎉</h1><p>كل معلوماتك مجدولة لوقت لاحق.</p><button class="btn" id="px">تدريب إضافي</button><button class="btn g" id="hm">رجوع</button></div>';$("px").onclick=()=>start(k,1);$("hm").onclick=()=>menu(k);return}
queue=shuf(it).slice(0,12);total=queue.length;res={right:0,errs:0};next()}
function next(){if(!queue.length)return end();const q=queue.shift();TR=false;({mcq:rMcq,tf:rTf,fill:rFill,essay:rEssay,type:rType})[q.t](q)}
function shell(h){const p=Math.max(0,Math.min(100,Math.round((total-queue.length-1)/total*100)));app.innerHTML='<div class="small">⭐ '+S.pts+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="card">'+h+"</div>"}
function record(q,ok){const b=S.boxes[q.f]||{box:0},dy=new Date().toDateString();
if(ok){if(b.last!==dy){b.box=Math.min(4,b.box+1);b.last=dy}}else b.box=Math.max(0,b.box-1);
b.due=Date.now()+(ok?GAP[b.box]*DAY:0);S.boxes[q.f]=b;
if(ok&&!q.w)S.pts+=10;if(!ok&&TR)S.pts=Math.max(0,S.pts-5);
if(ok){if(!q.w&&!q.r)res.right++}else{q.w=1;res.errs++;if(MODE==="prac")queue.splice(Math.min(3,queue.length),0,q)}save()}
const fb=(q,ok)=>'<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"صحيح ✓":"إجابة غير صحيحة")+"</b><div>"+q.x+'</div></div><button class="btn" id="nx">التالي</button>';
function rMcq(q){const o=shuf(q.o);shell('<p class="q">'+tm(q.s)+"</p>"+o.map((v,i)=>'<button class="opt" data-i="'+i+'">'+esc(v[0])+"</button>").join("")+'<div id="r"></div>');
const bs=[...app.querySelectorAll(".opt")];bs.forEach(b=>b.onclick=()=>{const ok=o[b.dataset.i][1];bs.forEach((x,i)=>{x.disabled=true;if(o[i][1])x.classList.add("ok")});if(!ok)b.classList.add("no");record(q,ok);$("r").innerHTML=fb(q,ok);$("nx").onclick=next})}
function rTf(q){shell('<p class="q">'+tm(q.s)+'</p><div class="row"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div><div id="r"></div>');
const bs=[...app.querySelectorAll(".opt")];bs.forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==="1")===q.a;bs.forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");record(q,ok);$("r").innerHTML=fb(q,ok);$("nx").onclick=next})}
function rFill(q){const parts=q.s.split("_"),n=q.a.length,bank=shuf(q.a.concat(q.d)),pick=Array(n).fill(null);
let h='<p class="sent">';parts.forEach((p,i)=>{h+=tm(p);if(i<n)h+='<button class="slot"></button>'});
h+='</p><div class="bank">'+bank.map(w=>'<button class="tile">'+esc(w)+"</button>").join("")+'</div><button class="btn" id="ck" disabled>تحقق</button><div id="r"></div>';shell(h);
const slots=[...app.querySelectorAll(".slot")],tiles=[...app.querySelectorAll(".tile")];
const draw=()=>{slots.forEach((s,i)=>s.textContent=pick[i]===null?"":bank[pick[i]]);tiles.forEach((t,i)=>t.disabled=pick.includes(i));$("ck").disabled=pick.includes(null)};
tiles.forEach((t,i)=>t.onclick=()=>{const k=pick.indexOf(null);if(k>=0){pick[k]=i;draw()}});
slots.forEach((s,k)=>s.onclick=()=>{pick[k]=null;draw()});
$("ck").onclick=()=>{let ok=true;pick.forEach((p,k)=>{const g=bank[p]===q.a[k];if(!g)ok=false;slots[k].classList.add(g?"ok":"no");slots[k].disabled=true});tiles.forEach(t=>t.disabled=true);$("ck").style.display="none";record(q,ok);
$("r").innerHTML=(ok?"":'<p class="small" dir="ltr" style="text-align:left">Correct: '+esc(q.a.join(" / "))+"</p>")+fb(q,ok);$("nx").onclick=next};draw()}
function rEssay(q){const bank=shuf(q.a.concat(q.d)),pk=[];
shell('<p class="q">'+tm(q.s)+'</p><div class="bank" id="ans" style="min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:8px"></div><div class="bank">'+bank.map(w=>'<button class="tile">'+esc(w)+"</button>").join("")+'</div><button class="btn" id="ck" disabled>تحقق</button><div id="r"></div>');
const tiles=[...app.querySelectorAll(".bank")[1].querySelectorAll(".tile")];
const draw=()=>{$("ans").innerHTML=pk.map((i,n)=>'<button class="tile" data-n="'+n+'">'+(n+1)+". "+esc(bank[i])+"</button>").join("");tiles.forEach((t,i)=>t.disabled=pk.includes(i));$("ck").disabled=!pk.length;$("ans").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{pk.splice(+b.dataset.n,1);draw()})};
tiles.forEach((t,i)=>t.onclick=()=>{pk.push(i);draw()});
$("ck").onclick=()=>{const ok=pk.map(i=>bank[i]).join("|")===q.a.join("|");tiles.forEach(t=>t.disabled=true);$("ans").style.pointerEvents="none";$("ck").style.display="none";record(q,ok);
$("r").innerHTML=(ok?"":'<p class="small" dir="ltr" style="text-align:left">Correct: '+esc(q.a.join(" → "))+"</p>")+fb(q,ok);$("nx").onclick=next};draw()}
function end(){app.innerHTML='<div class="card"><h1>انتهت الجلسة</h1><p>الإجابات الصحيحة من أول محاولة: <b>'+res.right+" من "+total+"</b> ("+Math.round(res.right/total*100)+'%)</p><p>النقاط: <b>⭐ '+S.pts+'</b></p><p class="small">الأسئلة التي أخطأت فيها تظهر مجددًا قبل غيرها في الجلسة القادمة.</p><button class="btn" id="a">جلسة جديدة</button><button class="btn g" id="b">رجوع</button></div>';$("a").onclick=()=>start(cur);$("b").onclick=()=>menu(cur)}

const lessonOK=k=>!!S.full[k],allOK=()=>Object.keys(LEC).every(lessonOK);
function alt(q,r){const o=q.o0||q,b={id:o.id,f:o.f,x:o.x,r,o0:o,w:0};
if(o.t==="mcq"){const c=o.o.find(v=>v[1])[0];
if(r>=2&&c.length<=30)return Object.assign(b,{t:"type",s:o.s,ans:c});
const w=shuf(o.o.filter(v=>!v[1]))[0][0],u=Math.random()<.5;
return Object.assign(b,{t:"tf",s:o.s+"  →  "+(u?c:w),a:u})}
if(o.t==="tf")return Object.assign(b,{t:"mcq",s:"Which statement is correct?",o:[["TRUE: "+o.s,o.a],["FALSE: "+o.s,!o.a]]});
if(o.t==="fill"&&o.a.length===1)return Object.assign(b,{t:"mcq",s:o.s.replace("_","_____"),o:o.a.concat(o.d).map((w,i)=>[w,i===0])});
return Object.assign({},o,{r,w:0})}
function rType(q){shell('<p class="q">'+tm(q.s)+'</p><input id="ti" dir="ltr" autocomplete="off" style="width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)" placeholder="اكتب الإجابة"><button class="btn" id="ck">تحقق</button><div id="r"></div>');
$("ck").onclick=()=>{const n=x=>x.toLowerCase().replace(/[^a-z0-9α-ω]/g,""),ok=n($("ti").value)===n(q.ans);$("ti").disabled=true;$("ck").style.display="none";record(q,ok);
$("r").innerHTML=(ok?"":'<p class="small" dir="ltr" style="text-align:left">Correct: '+esc(q.ans)+"</p>")+fb(q,ok);$("nx").onclick=next}}
function runSet(k,m,items){cur=k;MODE=m;items.forEach(q=>q.w=0);queue=shuf([...items]);total=queue.length;res={right:0,errs:0,wrong:[]};next()}
function startExam(){if(allOK())runSet("exam","exam",EXQ)}
const _rec=record;
record=function(q,ok){_rec(q,ok);if(MODE==="prac")return;const o=q.o0||q,r=q.r||0;
if(!ok&&r===0)res.wrong.push(o);
if(MODE==="exam"){const m=S.exm[o.id]||0;S.exm[o.id]=ok?Math.max(0,m-1):m+1;save();
if(!ok&&r<2)queue.push(alt(o,m+1>=2?2:r+1))}};
const _end=end;
end=function(){if(MODE==="prac")return _end();
if(MODE==="lesson"){const ok=!res.wrong.length;if(ok){S.full[cur]=1;save()}
app.innerHTML='<div class="card"><h1>'+(ok?"درجة كاملة ✓":"لم تكتمل الدرجة")+"</h1><p>"+res.right+" من "+total+"</p>"+(ok?"":"<p>أخطأت في:</p><ul dir='ltr' style='text-align:left'>"+res.wrong.map(q=>"<li>"+esc(q.s)+"</li>").join("")+"</ul>")+'<button class="btn" id="a">'+(ok?"رجوع":"إعادة اختبار الدرس")+'</button><button class="btn g" id="b">القائمة</button></div>';
$("a").onclick=()=>ok?menu(cur):runSet(cur,"lesson",[...LEC[cur].Q]);$("b").onclick=()=>menu(cur);return}
const st=EXQ.filter(q=>(S.exm[q.id]||0)>=2);S.exbest=Math.max(S.exbest||0,res.right);save();
app.innerHTML='<div class="card"><h1>نتيجة الاختبار الشامل</h1><p>الصحيح من أول محاولة: <b>'+res.right+" من "+total+"</b> ("+Math.round(res.right/total*100)+'%)</p><p class="small">أفضل نتيجة: '+S.exbest+"</p>"+(st.length?"<p>أسئلة متعثرة (أخطأت فيها مرتين فأكثر)، تعود بصيغة مختلفة:</p><ul dir='ltr' style='text-align:left'>"+st.map(q=>"<li>"+esc(q.s)+"</li>").join("")+"</ul>":"<p>لا أسئلة متعثرة 🎉</p>")+'<button class="btn" id="a">إعادة الاختبار</button><button class="btn g" id="b">القائمة</button></div>';
$("a").onclick=startExam;$("b").onclick=home};

function start(k,force){cur=k;MODE="prac";const Q=LEC[k].P||LEC[k].Q;Q.forEach(q=>q.w=0);const now=Date.now();

if(!it.length){app.innerHTML='<div class="card"><h1>لا مراجعة مستحقة الآن 🎉</h1><p>كل معلوماتك مجدولة لوقت لاحق.</p><button class="btn" id="px">تدريب إضافي</button><button class="btn g" id="hm">رجوع</button></div>';$("px").onclick=()=>start(k,1);$("hm").onclick=()=>menu(k);return}
queue=shuf(it).slice(0,12);total=queue.length;res={right:0,errs:0};next()}
function next(){if(!queue.length)return end();const q=queue.shift();TR=false;INQ=true;EXC=exc(q);({mcq:rMcq,tf:rTf,fill:rFill,essay:rEssay,type:rType})[q.t](q)}
function shell(h){const p=Math.max(0,Math.min(100,Math.round((total-queue.length-1)/total*100)));app.innerHTML='<div class="small">⭐ '+S.pts+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="card">'+h+"</div>"}
function record(q,ok){const b=S.boxes[q.f]||{box:0},dy=new Date().toDateString();
if(ok){if(b.last!==dy){b.box=Math.min(4,b.box+1);b.last=dy}}else b.box=Math.max(0,b.box-1);
b.due=Date.now()+(ok?GAP[b.box]*DAY:0);S.boxes[q.f]=b;
if(ok&&!q.w)S.pts+=10;if(!ok&&TR)S.pts=Math.max(0,S.pts-5);
if(ok){if(!q.w&&!q.r)res.right++}else{q.w=1;res.errs++;if(MODE==="prac")queue.splice(Math.min(3,queue.length),0,q)}save()}
const fb=(q,ok)=>'<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"صحيح ✓":"إجابة غير صحيحة")+"</b><div>"+q.x+'</div></div><button class="btn" id="nx">التالي</button>';

function rTf(q){shell('<p class="q">'+tm(q.s)+'</p><div class="row"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div><div id="r"></div>');
const bs=[...app.querySelectorAll(".opt")];bs.forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==="1")===q.a;bs.forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");record(q,ok);$("r").innerHTML=fb(q,ok);$("nx").onclick=next})}
function rFill(q){const parts=q.s.split("_"),n=q.a.length,bank=shuf(q.a.concat(q.d)),pick=Array(n).fill(null);
let h='<p class="sent">';parts.forEach((p,i)=>{h+=tm(p);if(i<n)h+='<button class="slot"></button>'});
h+='</p><div class="bank">'+bank.map(w=>'<button class="tile">'+esc(w)+"</button>").join("")+'</div><button class="btn" id="ck" disabled>تحقق</button><div id="r"></div>';shell(h);
const slots=[...app.querySelectorAll(".slot")],tiles=[...app.querySelectorAll(".tile")];
const draw=()=>{slots.forEach((s,i)=>s.textContent=pick[i]===null?"":bank[pick[i]]);tiles.forEach((t,i)=>t.disabled=pick.includes(i));$("ck").disabled=pick.includes(null)};
tiles.forEach((t,i)=>t.onclick=()=>{const k=pick.indexOf(null);if(k>=0){pick[k]=i;draw()}});
slots.forEach((s,k)=>s.onclick=()=>{pick[k]=null;draw()});
$("ck").onclick=()=>{let ok=true;pick.forEach((p,k)=>{const g=bank[p]===q.a[k];if(!g)ok=false;slots[k].classList.add(g?"ok":"no");slots[k].disabled=true});tiles.forEach(t=>t.disabled=true);$("ck").style.display="none";record(q,ok);
$("r").innerHTML=(ok?"":'<p class="small" dir="ltr" style="text-align:left">Correct: '+esc(q.a.join(" / "))+"</p>")+fb(q,ok);$("nx").onclick=next};draw()}
function rEssay(q){const bank=shuf(q.a.concat(q.d)),pk=[];
shell('<p class="q">'+tm(q.s)+'</p><div class="bank" id="ans" style="min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:8px"></div><div class="bank">'+bank.map(w=>'<button class="tile">'+esc(w)+"</button>").join("")+'</div><button class="btn" id="ck" disabled>تحقق</button><div id="r"></div>');
const tiles=[...app.querySelectorAll(".bank")[1].querySelectorAll(".tile")];
const draw=()=>{$("ans").innerHTML=pk.map((i,n)=>'<button class="tile" data-n="'+n+'">'+(n+1)+". "+esc(bank[i])+"</button>").join("");tiles.forEach((t,i)=>t.disabled=pk.includes(i));$("ck").disabled=!pk.length;$("ans").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{pk.splice(+b.dataset.n,1);draw()})};
tiles.forEach((t,i)=>t.onclick=()=>{pk.push(i);draw()});
$("ck").onclick=()=>{const ok=pk.map(i=>bank[i]).join("|")===q.a.join("|");tiles.forEach(t=>t.disabled=true);$("ans").style.pointerEvents="none";$("ck").style.display="none";record(q,ok);
$("r").innerHTML=(ok?"":'<p class="small" dir="ltr" style="text-align:left">Correct: '+esc(q.a.join(" → "))+"</p>")+fb(q,ok);$("nx").onclick=next};draw()}
function end(){app.innerHTML='<div class="card"><h1>انتهت الجلسة</h1><p>الإجابات الصحيحة من أول محاولة: <b>'+res.right+" من "+total+"</b> ("+Math.round(res.right/total*100)+'%)</p><p>النقاط: <b>⭐ '+S.pts+'</b></p><p class="small">الأسئلة التي أخطأت فيها تظهر مجددًا قبل غيرها في الجلسة القادمة.</p><button class="btn" id="a">جلسة جديدة</button><button class="btn g" id="b">رجوع</button></div>';$("a").onclick=()=>start(cur);$("b").onclick=()=>menu(cur)}

["Florence Nightingale is the founder of modern nursing: she built the first nursing philosophy (health maintenance and restoration) and opened the first organized nurse training school at St. Thomas' Hospital, London, in 1860.","فلورنس نايتنجيل مؤسِّسة التمريض الحديث: وضعت أول فلسفة تمريضية (حفظ الصحة واستعادتها) وافتتحت أول مدرسة منظمة لتدريب الممرضات في مستشفى سانت توماس بلندن عام 1860."],
["Mary Mahoney was the first African-American professional nurse; she raised awareness of cultural diversity and respect for every individual.","ماري ماهوني أول ممرضة أمريكية مهنية من أصل أفريقي، ونبّهت إلى التنوع الثقافي واحترام كل فرد."],
["Mary Adelaide Nutting, first professor of nursing at Columbia University (1907), argued that nursing education needed more funding, given to university schools of nursing.","ماري أديلايد نوتينج أول أستاذة تمريض في جامعة كولومبيا (1907)، ورأت أن التعليم التمريضي يحتاج دعمًا ماليًا يُوجَّه لكليات التمريض الجامعية."],
["Rufaidah bint Sa'ad, born in Yathrib, is recognized as the first Muslim nurse.","رفيدة بنت سعد، وُلدت في يثرب، تُعرف بأنها أول ممرضة مسلمة."],
["The word nurse comes from a Latin word meaning to nourish.","كلمة nurse مشتقة من كلمة لاتينية معناها يغذّي."],
["Criteria of a profession: specialized education, body of knowledge, service orientation, research, code of ethics, autonomy. Financial profit is not a criterion.","معايير المهنة: تعليم متخصص، وإطار معرفي، وتوجّه خدمي، وبحث، ومدونة أخلاقيات، واستقلالية. الربح المالي ليس معيارًا."],
["Pathways: diploma (hospital apprenticeship), ADN (community college), BSN (university: practice, leadership, community health, research), then master's and doctoral degrees.","المسارات: الدبلوم (تدريب في المستشفى)، وADN (كلية مجتمع)، وBSN (جامعي: ممارسة وقيادة وصحة مجتمع وبحث)، ثم الماجستير والدكتوراه."],
["Nursing practice has four areas: promoting health, preventing illness, restoring health, care of the dying. Prescribing medications is not one of them.","للتمريض أربعة مجالات: تعزيز الصحة، والوقاية من المرض، واستعادة الصحة، ورعاية المحتضرين. وصف الأدوية ليس منها."],
["Roles: caregiver, advocate (protects human and legal rights), educator, communicator, manager, counselor (helps the client cope with stress).","الأدوار: مقدّم رعاية، ومدافع عن حقوق المريض (يحمي حقوقه الإنسانية والقانونية)، ومثقِّف صحي، ومتواصل، ومدير، ومرشد (يساعد على مواجهة الضغوط)."],
["Autonomy is independence and self-governance in decisions and practice; accountability is professional and legal responsibility for the quality of care.","الاستقلالية هي الحكم الذاتي في القرار والممارسة؛ والمساءلة هي المسؤولية المهنية والقانونية عن جودة الرعاية."],
["ANA standards in order: assessment, diagnosis (analysis of assessment data), outcome identification, planning, implementation, evaluation.","معايير ANA بالترتيب: التقييم، التشخيص (تحليل بيانات التقييم)، تحديد النتائج، التخطيط، التنفيذ، التقويم."],
["Nurses care for individuals, families and communities. In the past the acute care hospital was the main practice setting; today nurses also work in homes and clinics.","يقدم الممرضون الرعاية للأفراد والأسر والمجتمعات. كان المستشفى للرعاية الحادة أهم بيئة قديمًا، واليوم يعملون أيضًا في المنازل والعيادات."]],
inf:[
["An infection occurs when pathogens (such as bacteria) invade the body and may cause disease.","تحدث العدوى عندما تغزو الكائنات الممرضة (كالبكتيريا) الجسم وقد تسبب المرض."],
["Nosocomial (healthcare-associated) infections are acquired after hospitalization, more than 48 hours after admission; they were not present or incubating at admission.","العدوى المكتسبة من المستشفى (المرتبطة بالرعاية) تحدث بعد أكثر من 48 ساعة من الدخول، ولم تكن موجودة ولا في فترة الحضانة عند الدخول."],
["Chain of infection: pathogen, reservoir (where it lives), portal of exit, mode of transmission, portal of entry. Breaking any one link stops transmission.","سلسلة العدوى: الكائن الممرض، والمستودع (مكان عيشه)، ومنفذ الخروج، وطريقة الانتقال، ومنفذ الدخول. قطع أي حلقة يوقف الانتقال."],
["Systemic signs: fever, fatigue, loss of appetite. Localized signs: redness, swelling, pain, tenderness, wound drainage.","الأعراض العامة: حمى وإرهاق وفقدان الشهية. الأعراض الموضعية: احمرار وتورم وألم وحساسية وتصريف من الجرح."],
["Susceptibility rises with age (very young or old), stress, poor nutrition and immune suppression such as chemotherapy. Intrinsic risk factors include diabetes mellitus.","تزداد القابلية للعدوى مع العمر (الصغير جدًا والكبير)، والضغط النفسي، وسوء التغذية، وكبت المناعة كالعلاج الكيميائي. من العوامل الداخلية داء السكري."],
["Natural defenses: skin, stomach acid, coughing and sneezing. Antisepsis is not a natural defense.","الدفاعات الطبيعية: الجلد وحمض المعدة والسعال والعطاس. التطهير بمطهر ليس دفاعًا طبيعيًا."],
["A carrier may transmit pathogens without showing any symptoms.","الحامل للميكروب قد ينقله دون ظهور أعراض عليه."],
["Transmission: direct contact (kissing), indirect contact (contaminated objects), vehicle (food, water, contaminated items), airborne, droplet.","طرق الانتقال: تلامس مباشر (كالتقبيل)، وغير مباشر (أدوات ملوثة)، وبوسيط (طعام وماء وأدوات ملوثة)، ومحمول جوًا، وبالقطيرات."],
["Cleaning removes dirt and organic material; disinfection kills most microbes but not reliably endospores; sterilization destroys all microbial life including endospores.","التنظيف يزيل الأوساخ والمواد العضوية؛ والتطهير يقتل معظم الميكروبات ولا يضمن قتل الأبواغ؛ والتعقيم يدمّر كل أشكال الحياة الميكروبية بما فيها الأبواغ."],
["Medical asepsis (clean technique) reduces microbes and their spread; surgical asepsis (sterile technique) eliminates all microbes and spores and is used for urinary catheter insertion.","التعقيم الطبي (التقنية النظيفة) يقلل الميكروبات وانتشارها؛ والجراحي (التقنية المعقمة) يزيل كل الميكروبات وأبواغها ويُستعمل عند إدخال القسطرة البولية."],
["Hand hygiene is the single most important way to control infection; do it before and after contact with every patient.","نظافة اليدين أهم وسيلة للحد من العدوى؛ تُمارس قبل كل مريض وبعده."],
["Standard precautions apply to all patients. Goggles protect the eyes. Never recap, bend or break used needles; manage sharps and hospital waste safely (waste can be a reservoir of pathogens).","الاحتياطات القياسية تُطبَّق على كل المرضى. النظارات تحمي العينين. لا تُعاد تغطية الإبر المستعملة ولا تُثنى ولا تُكسر؛ والتخلص من الأدوات الحادة والنفايات يكون بأمان (النفايات مستودع محتمل للميكروبات)."],
["Airborne precautions need a negative pressure room and N95; droplet precautions (for example influenza) need a surgical mask; contact precautions need gown and gloves.","الاحتياطات الهوائية تحتاج غرفة ضغط سالب وكمامة N95؛ والقطيرات (كالإنفلونزا) كمامة جراحية؛ والتلامس رداء وقفازات."]],
hand:[
["Hand hygiene means cleaning the hands with soap and water or an alcohol-based rub to remove microorganisms.","نظافة اليدين تعني تنظيفها بالماء والصابون أو بمطهر كحولي لإزالة الكائنات الدقيقة."],
["Ignaz Semmelweis showed that hand washing reduces maternal mortality.","إغناز سيملفايس بيّن أن غسل اليدين يقلل وفيات الأمهات."],
["Before washing: keep nails short, remove jewellery and roll sleeves above the elbows.","قبل الغسل: قصّ الأظافر، وانزع المجوهرات، وارفع الأكمام فوق المرفقين."],
["Keep wet hands lower than the elbows so water flows toward the fingertips.","أبقِ اليدين المبللتين أخفض من المرفقين ليجري الماء نحو أطراف الأصابع."],
["Use warm, not hot, water because it removes less of the skin's natural oils.","استعمل ماءً دافئًا لا ساخنًا لأنه يزيل أقل من زيوت الجلد الطبيعية."],
["Dry hands with a clean paper towel, then close the tap with the towel or elbow.","جفّف اليدين بمنشفة ورقية نظيفة ثم أغلق الصنبور بالمنشفة أو بالكوع."]],
needs:[
["A need is something necessary or desired to maintain life or physical and mental well-being.","الحاجة هي ما يلزم أو يُرغب فيه للحفاظ على الحياة أو العافية الجسدية والنفسية."],
["Characteristics of needs: universal, interrelated, individualized, dynamic, influenced by many factors, not always consciously recognized.","خصائص الحاجات: عامة، ومترابطة، وفردية، ومتغيرة، وتتأثر بعوامل كثيرة، وليست دائمًا واعية."],
["Maslow's levels from base to top: physiological, safety and security, love and belonging, esteem, self-actualization.","مستويات ماسلو من القاعدة للقمة: الفسيولوجية، والأمان، والحب والانتماء، وتقدير الذات، وتحقيق الذات."],
["Once an essential need is met, the person experiences a need on a higher level.","بعد إشباع الحاجة الأساسية تظهر حاجة من مستوى أعلى."],
["Physiological needs: oxygen (most essential), water, food, elimination, sleep and rest, activity, sex, temperature regulation.","الحاجات الفسيولوجية: الأكسجين (الأهم)، والماء، والطعام، والإخراج، والنوم والراحة، والنشاط، والجنس، وتنظيم الحرارة."],
["Nursing activities: measure intake and output, feed clients, give oxygen, promote rest, turn immobile patients to prevent pressure ulcers.","أنشطة التمريض: قياس المأخوذ والخارج، وإطعام المريض، وإعطاء الأكسجين، وتهيئة الراحة، وتقليب المريض الثابت لمنع قرح الفراش."],
["Safety: hand washing, sterile dressings, night light, explaining procedures. Belonging: visitors and reassurance. Esteem (feeling respected and valued): encourage independence and self-care.","الأمان: غسل اليدين، وضمادات معقمة، وضوء ليلي، وشرح الإجراءات. الانتماء: الزيارات والطمأنة. تقدير الذات (الشعور بالاحترام والقيمة): تشجيع الاستقلال والعناية الذاتية."],
["The categories are not a rigid checklist; dignity may be urgent during an invasive procedure.","هذه الفئات ليست قائمة جامدة؛ فقد تكون الكرامة عاجلة أثناء إجراء باضع."]],
vitals:[
["Vital signs: temperature, pulse, respirations, blood pressure, pain, and oxygen saturation.","العلامات الحيوية: الحرارة والنبض والتنفس وضغط الدم والألم وتشبع الأكسجين."],
["Adult normals: temperature 36.5–37.5°C, pulse 60–100/min, respirations 12–20/min, BP 120/80 mmHg.","القيم الطبيعية للبالغ: الحرارة 36.5–37.5°م، النبض 60–100/د، التنفس 12–20/د، الضغط 120/80."],
["Body temperature = heat produced − heat lost; the anterior hypothalamus controls heat loss and the posterior controls heat production.","حرارة الجسم = الحرارة المنتَجة − المفقودة؛ المهاد الأمامي يتحكم بفقدها والخلفي بإنتاجها."],
["Heat loss: radiation, conduction, convection, evaporation. Fever grades: low 37.3–38, moderate 38.1–39, high 39.1–41; hypothermia is below 35°C.","فقد الحرارة: بالإشعاع والتوصيل والحمل والتبخر. درجات الحمى: منخفضة 37.3–38، متوسطة 38.1–39، عالية 39.1–41؛ وانخفاض الحرارة أقل من 35°م."],
["Pulse sites include carotid, apical, brachial, radial, femoral, popliteal and dorsalis pedis.","مواضع النبض: السباتي والقمّي والعضدي والكعبري والفخذي والمأبضي وظهر القدم."],
["Cardiac output = pulse rate × stroke volume; tachycardia is above 100 and bradycardia below 60; never palpate both carotids together.","الناتج القلبي = معدل النبض × حجم الضربة؛ تسرع القلب فوق 100 وبطؤه تحت 60؛ لا يُجسّ السباتيان معًا."],
["Bradypnea is below 12 breaths/min and tachypnea above 20; ventilation, diffusion and perfusion are the steps of respiration.","بطء التنفس أقل من 12 وتسرعه أكثر من 20 في الدقيقة؛ التهوية والانتشار والتروية مراحل التنفس."],
["BP = cardiac output × peripheral resistance; hypertension is above 140/90; orthostatic hypotension is a drop of 25 systolic or 10 diastolic.","الضغط = الناتج القلبي × المقاومة الطرفية؛ ارتفاع الضغط فوق 140/90؛ وهبوط الضغط الانتصابي انخفاض 25 انقباضي أو 10 انبساطي."]]
